<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sunCurveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="userFreewheelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="850" height="440" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="40" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Directional Ratchet (Catch-Up Resume)</text>
  <text x="40" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Freewheels when you adjust ahead of schedule, then seamlessly resumes when the solar curve catches up</text>

  <!-- Axes & Grid -->
  <g stroke="#334155" stroke-dasharray="3,3" stroke-width="1">
    <!-- Horizontal Grid Lines -->
    <line x1="90" y1="100" x2="790" y2="100" />
    <line x1="90" y1="160" x2="790" y2="160" />
    <line x1="90" y1="230" x2="790" y2="230" />
    <line x1="90" y1="310" x2="790" y2="310" />
    <line x1="90" y1="370" x2="790" y2="370" stroke-dasharray="none" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Y-Axis Labels -->
  <g fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="end">
    <text x="78" y="104">100%</text>
    <text x="78" y="164">75%</text>
    <text x="78" y="234">45%</text>
    <text x="78" y="314">20%</text>
    <text x="78" y="374">0%</text>
  </g>

  <!-- X-Axis Labels (Time of Day) -->
  <g fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
    <text x="140" y="398">12:00 PM (Noon)</text>
    <text x="320" y="398">3:30 PM</text>
    <text x="450" y="398">5:30 PM (User Dims)</text>
    <text x="610" y="398">7:15 PM (Catch-Up)</text>
    <text x="740" y="398">9:30 PM (Night)</text>
  </g>

  <!-- 1. Natural Solar Curve (Dotted / Soft) -->
  <!-- Starts at 100% (y=100), drops gradually to 75% at 5:30 (x=450, y=160), reaches 45% at 7:15 (x=610, y=230), and 20% at night (x=750, y=310) -->
  <path d="M 120 100 C 260 100, 360 120, 450 160 C 530 196, 570 215, 610 230 C 660 250, 700 310, 780 310"
        fill="none" stroke="url(#sunCurveGrad)" stroke-width="2.5" stroke-dasharray="5,4" opacity="0.6"/>

  <!-- Shaded Freewheel Zone -->
  <path d="M 450 160 L 450 230 L 610 230 C 570 215, 530 196, 450 160 Z"
        fill="#ec4899" fill-opacity="0.08"/>

  <!-- 2. Actual Light Path -->
  <!-- Follows solar curve until 5:30 PM (x=450) -->
  <path d="M 120 100 C 260 100, 360 120, 450 160"
        fill="none" stroke="#38bdf8" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Manual Step Down at 5:30 PM (User dims to 45%) -->
  <line x1="450" y1="160" x2="450" y2="230" stroke="#ec4899" stroke-width="3" stroke-dasharray="3,3"/>
  <circle cx="450" cy="160" r="5" fill="#38bdf8"/>
  <circle cx="450" cy="230" r="6" fill="#ec4899" stroke="#ffffff" stroke-width="2"/>

  <!-- Freewheeling Horizontal Line (450 to 610) -->
  <line x1="450" y1="230" x2="610" y2="230" stroke="url(#userFreewheelGrad)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Catch-Up Re-engagement Point (x=610, y=230) -->
  <circle cx="610" cy="230" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Resumed Solar Path into Night Floor (610 to 780) -->
  <path d="M 610 230 C 660 250, 700 310, 780 310"
        fill="none" stroke="#10b981" stroke-width="3.5" filter="url(#glow)"/>
  <circle cx="780" cy="310" r="5" fill="#10b981"/>

  <!-- Callout 1: User Dims Early -->
  <g transform="translate(370, 110)">
    <rect x="-10" y="-20" width="170" height="42" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <text x="75" y="-3" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">5:30 PM: User Dims to 45%</text>
    <text x="75" y="13" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Ahead of 75% natural curve</text>
  </g>

  <!-- Callout 2: Freewheel Zone -->
  <g transform="translate(530, 260)">
    <rect x="-70" y="-14" width="140" height="26" rx="5" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
    <text x="0" y="4" fill="#f5d0fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Freewheel Zone (Hold)</text>
  </g>

  <!-- Callout 3: Catch-Up Resume -->
  <g transform="translate(610, 140)">
    <rect x="-85" y="-20" width="170" height="42" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <text x="0" y="-3" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">7:15 PM: Catch-Up Resume</text>
    <text x="0" y="13" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Solar curve matches manual setting</text>
    <!-- Pointer line to point -->
    <line x1="0" y1="22" x2="0" y2="80" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>

  <!-- Legend -->
  <g transform="translate(520, 25)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
    <!-- Natural Curve -->
    <line x1="0" y1="8" x2="24" y2="8" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="32" y="12" fill="#cbd5e1">Natural Solar Schedule</text>
    <!-- Actual Output -->
    <line x1="170" y1="8" x2="194" y2="8" stroke="#10b981" stroke-width="3"/>
    <text x="202" y="12" fill="#cbd5e1">Active Output (Mimick)</text>
  </g>
</svg>
